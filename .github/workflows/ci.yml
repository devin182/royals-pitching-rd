name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests

  r:
    name: R lint + tests (testthat, SQL/data assertions, frozen model)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::duckdb
            any::data.table
            any::xgboost
            any::jsonlite
            any::testthat
            any::lintr
      - name: lintr
        run: |
          l <- c(lintr::lint_dir("R"), lintr::lint_dir("tests"))
          print(l)
          if (length(l) > 0) quit(status = 1)
        shell: Rscript {0}
      - name: testthat
        run: Rscript tests/testthat.R

  site:
    name: Site build is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild pages and check nothing changed
        run: |
          python3 scripts/build_pages.py
          git diff --exit-code -- site
      - name: No visible TODO text in built pages
        run: |
          ! grep -n "TODO" site/*.html
      - name: Data files are valid JSON (every file under site/data and site/tunnel)
        run: |
          python3 -c "import json,pathlib; fs=[*pathlib.Path('site/data').rglob('*.json'), *pathlib.Path('site/tunnel').rglob('*.json')]; [json.loads(f.read_text()) for f in fs]; print(len(fs), 'JSON files ok')"
      - name: All 30 teams have complete, consistent data (tests/check_teams.py)
        run: python3 tests/check_teams.py

  js:
    name: JS Stuff+ evaluator matches R (design lab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node evaluator vs R predictions (tests/fixtures/lab_vectors.json)
        run: node tests/js/lab.test.js
